name: docker-ghcr

# Builds the JVM Docker images (amd64 and arm64) and publishes them to the GitHub container registry of the repository
# owner, e.g. ghcr.io/<owner>/commafeed:latest-h2-jvm. Only uses the workflow's own token, no secrets to configure.

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  JAVA_VERSION: 25
  DOCKER_BUILD_SUMMARY: false

jobs:
  image:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # the database driver is chosen when building, one image per database
        database: [ "h2", "postgresql", "mysql", "mariadb" ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "graalvm"
          cache: "maven"

      - name: Set up NodeJS cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: 'commafeed-client/package-lock.json'

      # tests already run in the ci workflow
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress install -P${{ matrix.database }} -DskipTests

      - name: Prepare the jvm package for the Dockerfile
        run: |
          mkdir -p artifacts/extracted-jvm-package
          unzip -q commafeed-server/target/commafeed-*-jvm.zip -d artifacts/extracted-jvm-package
          mv artifacts/extracted-jvm-package/commafeed-* artifacts/extracted-jvm-package/quarkus-app

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push - jvm
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: commafeed-server/src/main/docker/Dockerfile.jvm
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            ghcr.io/${{ github.repository_owner }}/commafeed:latest-${{ matrix.database }}-jvm
            ghcr.io/${{ github.repository_owner }}/commafeed:${{ github.sha }}-${{ matrix.database }}-jvm
